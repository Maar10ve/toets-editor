<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title id="docTitle">Toets Tekstverwerker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .toolbar {
      max-width: 980px; margin: 0 auto 10px auto; background: #fff; padding: 8px 12px;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex; flex-wrap: nowrap; gap: 5px; align-items: center; overflow-x: auto;
    }
    button {
      padding: 5px 9px; border: 1px solid #ccc; background: #fafafa; border-radius: 4px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    button:hover { background: #e9ecef; }
    button.open { background: #f1f3f4; border-color: #bbb; font-weight: bold; margin-left: auto; }
    button.export { background: #0b57d0; color: #fff; border-color: #0b57d0; font-weight: bold; }
    button.export:hover { background: #0842a0; }
    button.lang { background: #eef3fc; border-color: #b6d0fb; color: #0b57d0; font-weight: bold; }
    button.lang:hover { background: #dce8fc; }
    #editor {
      max-width: 900px; min-height: 600px; margin: 0 auto; background: #fff; padding: 40px;
      border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); outline: none; font-size: 12pt; line-height: 1.5;
    }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    td, th { border: 1px solid #333; padding: 6px 10px; min-width: 50px; }
  </style>
</head>
<body>

<div class="toolbar">
  <button id="btnHeading" onclick="cmd('formatBlock', 'H2')"><b>Kop</b></button>
  <button id="btnNormal" onclick="cmd('formatBlock', 'P')">Normaal</button>
  <button id="btnBold" onclick="cmd('bold')"><b>B</b></button>
  <button id="btnItalic" onclick="cmd('italic')"><i>I</i></button>
  <button id="btnUnderline" onclick="cmd('underline')"><u>U</u></button>
  <button id="btnBullet" onclick="cmd('insertUnorderedList')">• Lijst</button>
  <button id="btnNumber" onclick="cmd('insertOrderedList')">1. Lijst</button>
  <button id="btnTable" onclick="insertTable()">+ Tabel</button>
  <button id="btnRow" onclick="addRow()">+ Rij</button>
  <button id="btnCol" onclick="addCol()">+ Kolom</button>
  <input type="file" id="fileInput" accept=".pdf" style="display:none" onchange="importPdf(event)">
  <button id="btnOpen" class="open" onclick="document.getElementById('fileInput').click()">Openen (.pdf)</button>
  <button id="btnExport" class="export" onclick="exportDocx()">Opslaan (.docx)</button>
  <button id="btnLang" class="lang" onclick="toggleLang()">EN</button>
</div>

<div id="editor" contenteditable="true" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
  <p>Typ hier je antwoord...</p>
</div>

<script type="module">
  import * as pdfjsLib from './pdf.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

  window.importPdf = async function(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let htmlParts = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();

        // Groepeer tekstfragmenten per regel (op basis van Y-positie)
        const lines = [];
        for (const item of textContent.items) {
          if (!item.str || !item.str.trim()) continue;
          const y = Math.round(item.transform[5]);
          const x = item.transform[4];
          const fontSize = Math.round(Math.abs(item.transform[0]));

          let line = lines.find(l => Math.abs(l.y - y) <= 4);
          if (!line) {
            line = { y, items: [], maxFont: fontSize };
            lines.push(line);
          }
          line.items.push({ x, str: item.str, width: item.width });
          if (fontSize > line.maxFont) line.maxFont = fontSize;
        }

        // Sorteer regels van boven naar beneden en items van links naar rechts
        lines.sort((a, b) => b.y - a.y);

        // Bepaal standaard lettergrootte voor kop-herkenning
        const sizes = lines.map(l => l.maxFont).sort((a, b) => a - b);
        const medianFont = sizes[Math.floor(sizes.length / 2)] || 12;

        // Detecteer opeenvolgende regels met meerdere kolommen om er een tabel van te maken
        let tableBuffer = [];

        const flushTable = () => {
          if (tableBuffer.length === 0) return;
          if (tableBuffer.length >= 2) {
            let tbl = '<table><tbody>';
            for (const rowCells of tableBuffer) {
              tbl += '<tr>' + rowCells.map(c => `<td>${escXml(c)}</td>`).join('') + '</tr>';
            }
            tbl += '</tbody></table>';
            htmlParts.push(tbl);
          } else {
            htmlParts.push(`<p>${escXml(tableBuffer[0].join('   '))}</p>`);
          }
          tableBuffer = [];
        };

        for (const line of lines) {
          line.items.sort((a, b) => a.x - b.x);
          const cells = [];
          let currentCell = '';
          let prevEnd = null;

          for (const it of line.items) {
            if (prevEnd !== null && (it.x - prevEnd) > 25) {
              cells.push(currentCell.trim());
              currentCell = it.str;
            } else {
              currentCell += (prevEnd !== null && (it.x - prevEnd) > 2 ? ' ' : '') + it.str;
            }
            prevEnd = it.x + (it.width || 0);
          }
          if (currentCell.trim()) cells.push(currentCell.trim());

          if (cells.length >= 2 && line.maxFont <= medianFont + 1) {
            tableBuffer.push(cells);
          } else {
            flushTable();
            const fullText = escXml(cells.join(' '));
            if (line.maxFont >= medianFont + 3) {
              htmlParts.push(`<h2>${fullText}</h2>`);
            } else {
              htmlParts.push(`<p>${fullText}</p>`);
            }
          }
        }
        flushTable();
      }

      document.getElementById('editor').innerHTML = htmlParts.join('') || '<p><br></p>';
    } catch (err) {
      console.error(err);
      alert(window.getErrorMsg());
    } finally {
      event.target.value = '';
    }
  };
</script>

<script>
  const editor = document.getElementById('editor');
  let currentLang = 'nl';

  const i18n = {
    nl: {
      title: 'Toets Tekstverwerker',
      heading: '<b>Kop</b>',
      normal: 'Normaal',
      bullet: '• Lijst',
      number: '1. Lijst',
      table: '+ Tabel',
      row: '+ Rij',
      col: '+ Kolom',
      openBtn: 'Openen (.pdf)',
      exportBtn: 'Opslaan (.docx)',
      langBtn: 'EN',
      placeholder: 'Typ hier je antwoord...',
      promptRows: 'Aantal rijen:',
      promptCols: 'Aantal kolommen:',
      alertTable: 'Klik eerst in een cel van de tabel.',
      alertError: 'Kon dit PDF-bestand niet uitlezen. Controleer of het een tekst-PDF is (geen ingescande afbeelding).',
      fileName: 'toetsuitwerking.docx'
    },
    en: {
      title: 'Exam Word Processor',
      heading: '<b>Heading</b>',
      normal: 'Normal',
      bullet: '• List',
      number: '1. List',
      table: '+ Table',
      row: '+ Row',
      col: '+ Column',
      openBtn: 'Open (.pdf)',
      exportBtn: 'Save (.docx)',
      langBtn: 'NL',
      placeholder: 'Type your answer here...',
      promptRows: 'Number of rows:',
      promptCols: 'Number of columns:',
      alertTable: 'Please click inside a table cell first.',
      alertError: 'Could not read this PDF file. Please ensure it contains selectable text (not a scanned image).',
      fileName: 'exam_answer.docx'
    }
  };

  window.getErrorMsg = () => i18n[currentLang].alertError;

  function toggleLang() {
    const oldPlaceholder = i18n[currentLang].placeholder;
    currentLang = currentLang === 'nl' ? 'en' : 'nl';
    const t = i18n[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.title;
    document.getElementById('btnHeading').innerHTML = t.heading;
    document.getElementById('btnNormal').textContent = t.normal;
    document.getElementById('btnBullet').textContent = t.bullet;
    document.getElementById('btnNumber').textContent = t.number;
    document.getElementById('btnTable').textContent = t.table;
    document.getElementById('btnRow').textContent = t.row;
    document.getElementById('btnCol').textContent = t.col;
    document.getElementById('btnOpen').textContent = t.openBtn;
    document.getElementById('btnExport').textContent = t.exportBtn;
    document.getElementById('btnLang').textContent = t.langBtn;

    if (editor.textContent.trim() === oldPlaceholder) {
      editor.innerHTML = `<p>${t.placeholder}</p>`;
    }
  }

  function cmd(command, value = null) {
    document.execCommand(command, false, value);
    editor.focus();
  }

  function insertTable() {
    const t = i18n[currentLang];
    const rows = parseInt(prompt(t.promptRows, "3"), 10);
    const cols = parseInt(prompt(t.promptCols, "3"), 10);
    if (!rows || !cols || rows < 1 || cols < 1) return;
    let html = '<table><tbody>';
    for (let r = 0; r < rows; r++) {
      html += '<tr>';
      for (let c = 0; c < cols; c++) html += '<td><br></td>';
      html += '</tr>';
    }
    html += '</tbody></table><p><br></p>';
    document.execCommand('insertHTML', false, html);
  }

  function getActiveTableCell() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    let node = sel.anchorNode;
    while (node && node !== editor) {
      if (node.nodeName === 'TD' || node.nodeName === 'TH') return node;
      node = node.parentNode;
    }
    return null;
  }

  function addRow() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const row = cell.parentNode;
    const newRow = row.cloneNode(true);
    Array.from(newRow.cells).forEach(c => c.innerHTML = '<br>');
    row.parentNode.insertBefore(newRow, row.nextSibling);
  }

  function addCol() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const colIndex = cell.cellIndex;
    const table = cell.closest('table');
    Array.from(table.rows).forEach(row => {
      const newCell = row.insertCell(colIndex + 1);
      newCell.innerHTML = '<br>';
    });
  }

  function escXml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function serializeRuns(node, style = {}) {
    let xml = '';
    node.childNodes.forEach(child => {
      if (child.nodeType === 3) {
        const text = child.nodeValue;
        if (text) {
          let rPr = '';
          if (style.b) rPr += '<w:b/>';
          if (style.i) rPr += '<w:i/>';
          if (style.u) rPr += '<w:u w:val="single"/>';
          if (style.h) rPr += '<w:b/><w:sz w:val="32"/>';
          xml += `<w:r>${rPr ? `<w:rPr>${rPr}</w:rPr>` : ''}<w:t xml:space="preserve">${escXml(text)}</w:t></w:r>`;
        }
      } else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (tag === 'BR') {
          xml += '<w:r><w:br/></w:r>';
        } else {
          const nextStyle = { ...style };
          if (tag === 'B' || tag === 'STRONG') nextStyle.b = true;
          if (tag === 'I' || tag === 'EM') nextStyle.i = true;
          if (tag === 'U') nextStyle.u = true;
          xml += serializeRuns(child, nextStyle);
        }
      }
    });
    return xml;
  }

  function htmlToDocumentXml(root) {
    let bodyXml = '';
    function walk(container) {
      container.childNodes.forEach(node => {
        if (node.nodeType === 3) {
          if (node.nodeValue.trim()) {
            bodyXml += `<w:p>${serializeRuns(node.parentNode)}</w:p>`;
          }
          return;
        }
        if (node.nodeType !== 1) return;
        const tag = node.tagName;
        if (tag === 'H1' || tag === 'H2' || tag === 'H3') {
          bodyXml += `<w:p><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>${serializeRuns(node, { h: true })}</w:p>`;
        } else if (tag === 'UL' || tag === 'OL') {
          let idx = 1;
          node.querySelectorAll(':scope > li').forEach(li => {
            const prefix = tag === 'OL' ? `${idx++}. ` : '• ';
            bodyXml += `<w:p><w:pPr><w:ind w:left="720"/></w:pPr><w:r><w:t xml:space="preserve">${prefix}</w:t></w:r>${serializeRuns(li)}</w:p>`;
          });
        } else if (tag === 'TABLE') {
          bodyXml += `<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>
            <w:top w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:left w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:bottom w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:right w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:insideH w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:insideV w:val="single" w:sz="6" w:space="0" w:color="333333"/>
          </w:tblBorders></w:tblPr>`;
          node.querySelectorAll('tr').forEach(tr => {
            bodyXml += '<w:tr>';
            tr.querySelectorAll('td, th').forEach(td => {
              const runs = serializeRuns(td);
              bodyXml += `<w:tc><w:p>${runs || ''}</w:p></w:tc>`;
            });
            bodyXml += '</w:tr>';
          });
          bodyXml += '</w:tbl><w:p/>';
        } else if (tag === 'P' || tag === 'DIV') {
          bodyXml += `<w:p>${serializeRuns(node)}</w:p>`;
        } else {
          walk(node);
        }
      });
    }
    walk(root);
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
        <w:body>${bodyXml || '<w:p/>'}<w:sectPr/></w:body>
      </w:document>`;
  }

  function crc32(buf) {
    let c = ~0;
    for (let i = 0; i < buf.length; i++) {
      c ^= buf[i];
      for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
    }
    return (~c) >>> 0;
  }

  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const [name, content] of files) {
      const nameBytes = enc.encode(name);
      const data = enc.encode(content);
      const crc = crc32(data);
      const header = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(header.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(8, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      header.set(nameBytes, 30);
      parts.push(header, data);

      const cdir = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(cdir.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, data.length, true);
      cdv.setUint32(24, data.length, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint32(42, offset, true);
      cdir.set(nameBytes, 46);
      central.push(cdir);
      offset += header.length + data.length;
    }
    const cSize = central.reduce((s, a) => s + a.length, 0);
    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, cSize, true);
    edv.setUint32(16, offset, true);
    return new Blob([...parts, ...central, eocd], {
      type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  function exportDocx() {
    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
        <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
        <Default Extension="xml" ContentType="application/xml"/>
        <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
      </Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
        <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
      </Relationships>`;
    const docXml = htmlToDocumentXml(editor);
    const blob = makeZip([
      ['[Content_Types].xml', contentTypes],
      ['_rels/.rels', rels],
      ['word/document.xml', docXml]
    ]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = i18n[currentLang].fileName;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
