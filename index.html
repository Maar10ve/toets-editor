<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <title id="docTitle">Toets Tekstverwerker</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .toolbar {
      position: sticky;
      top: 10px;
      z-index: 100;
      max-width: 1140px;
      margin: 0 auto 10px auto;
      background: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
      align-items: center;
      overflow-x: auto;
    }
    button {
      padding: 5px 9px; border: 1px solid #ccc; background: #fafafa; border-radius: 4px;
      cursor: pointer; font-size: 13px; white-space: nowrap;
    }
    button:hover { background: #e9ecef; }
    button.clear { background: #fff5f5; border-color: #f5c2c7; color: #b02a37; }
    button.clear:hover { background: #ffe3e6; }
    button.open { background: #f1f3f4; border-color: #bbb; font-weight: bold; margin-left: auto; }
    button.export { background: #0b57d0; color: #fff; border-color: #0b57d0; font-weight: bold; }
    button.export:hover { background: #0842a0; }
    button.lang { background: #eef3fc; border-color: #b6d0fb; color: #0b57d0; font-weight: bold; }
    button.lang:hover { background: #dce8fc; }
    .status-bar {
      width: 210mm; max-width: 100%; margin: 0 auto 6px auto; font-size: 12px; color: #5f6368;
      text-align: right; box-sizing: border-box;
    }
    #editor {
      width: 210mm;
      max-width: 100%;
      box-sizing: border-box;
      min-height: 297mm;
      margin: 0 auto 30px auto;
      background-color: #fff;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(297mm - 1px),
        #cfd8dc calc(297mm - 1px),
        #cfd8dc 297mm
      );
      padding: 25mm;
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      outline: none;
      font-size: 11pt;
      line-height: 1.5;
    }
    #editor img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    td, th { border: 1px solid #333; padding: 6px 10px; min-width: 50px; }
  </style>
</head>
<body>

<div class="toolbar">
  <button id="btnHeading" onclick="cmd('formatBlock', 'H2')"><b>Kop</b></button>
  <button id="btnNormal" onclick="cmd('formatBlock', 'P')">Normaal</button>
  <button id="btnBold" onclick="cmd('bold')"><b>B</b></button>
  <button id="btnItalic" onclick="cmd('italic')"><i>I</i></button>
  <button id="btnUnderline" onclick="cmd('underline')"><u>U</u></button>
  <button id="btnBullet" onclick="cmd('insertUnorderedList')">• Lijst</button>
  <button id="btnNumber" onclick="cmd('insertOrderedList')">1. Lijst</button>
  <button id="btnTable" onclick="insertTable()">+ Tabel</button>
  <button id="btnRow" onclick="addRow()">+ Rij</button>
  <button id="btnDelRow" onclick="deleteRow()">- Rij</button>
  <button id="btnCol" onclick="addCol()">+ Kolom</button>
  <button id="btnDelCol" onclick="deleteCol()">- Kolom</button>
  <button id="btnClear" class="clear" onclick="clearEditor()">Wissen</button>
  <input type="file" id="fileInput" accept=".pdf,.docx" style="display:none">
  <button id="btnOpen" class="open" onclick="triggerOpenFile()">Openen</button>
  <button id="btnExport" class="export" onclick="exportDocx()">Opslaan (.docx)</button>
  <button id="btnLang" class="lang" onclick="toggleLang()">EN</button>
</div>

<div id="statusBar" class="status-bar">Let op: vergeet niet regelmatig op "Opslaan (.docx)" te klikken om je bestand op te slaan.</div>

<div id="editor" contenteditable="true" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off">
  <p>Open een nieuwe tab en ga naar <b>hvhl.remindotoets.nl</b> om je toets te starten.</p>
</div>

<script>
  const editor = document.getElementById('editor');
  const STORAGE_KEY_CONTENT = 'schoolyear_editor_content_v1';
  const STORAGE_KEY_LANG = 'schoolyear_editor_lang_v1';
  let currentLang = 'nl';

  const i18n = {
    nl: {
      title: 'Toets Tekstverwerker',
      heading: '<b>Kop</b>',
      normal: 'Normaal',
      bullet: '• Lijst',
      number: '1. Lijst',
      table: '+ Tabel',
      row: '+ Rij',
      delRow: '- Rij',
      col: '+ Kolom',
      delCol: '- Kolom',
      clearBtn: 'Wissen',
      openBtn: 'Openen',
      exportBtn: 'Opslaan (.docx)',
      langBtn: 'EN',
      statusReady: 'Let op: vergeet niet regelmatig op "Opslaan (.docx)" te klikken om je bestand op te slaan.',
      statusSaved: 'Concept lokaal bewaard (om ',
      statusSavedEnd: ') — vergeet niet op "Opslaan (.docx)" te klikken om je bestand op te slaan.',
      statusDownloaded: 'Bestand gedownload om ',
      placeholder: 'Open een nieuwe tab en ga naar <b>hvhl.remindotoets.nl</b> om je toets te starten.',
      promptRows: 'Aantal rijen:',
      promptCols: 'Aantal kolommen:',
      alertTable: 'Klik eerst in een cel van de tabel.',
      confirmClear: 'Weet je zeker dat je het hele document wilt wissen? Dit kan niet ongedaan worden gemaakt.',
      confirmOverwrite: 'Er staat al tekst in het document. Wilt u deze vervangen door het gekozen bestand?',
      alertError: 'Kon dit bestand niet openen. Controleer of het een geldig .pdf- of .docx-bestand is.',
      fileName: 'toetsuitwerking.docx'
    },
    en: {
      title: 'Exam Word Processor',
      heading: '<b>Heading</b>',
      normal: 'Normal',
      bullet: '• List',
      number: '1. List',
      table: '+ Table',
      row: '+ Row',
      delRow: '- Row',
      col: '+ Column',
      delCol: '- Column',
      clearBtn: 'Clear',
      openBtn: 'Open',
      exportBtn: 'Save (.docx)',
      langBtn: 'NL',
      statusReady: 'Note: do not forget to click "Save (.docx)" regularly to save your file.',
      statusSaved: 'Draft cached in browser (at ',
      statusSavedEnd: ') — remember to click "Save (.docx)" to save your file.',
      statusDownloaded: 'File downloaded at ',
      placeholder: 'Open a new tab and go to <b>hvhl.remindotoets.nl</b> to start your exam.',
      promptRows: 'Number of rows:',
      promptCols: 'Number of columns:',
      alertTable: 'Please click inside a table cell first.',
      confirmClear: 'Are you sure you want to clear the entire document? This cannot be undone.',
      confirmOverwrite: 'The document already contains text. Do you want to replace it with the selected file?',
      alertError: 'Could not open this file. Please ensure it is a valid .pdf or .docx file.',
      fileName: 'exam_answer.docx'
    }
  };

  function stripTags(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent.trim();
  }

  function hasMeaningfulContent() {
    const text = editor.textContent.trim();
    const hasImg = editor.querySelector('img') !== null;
    const hasTable = editor.querySelector('table') !== null;
    if (hasImg || hasTable) return true;
    return text !== '' && text !== stripTags(i18n.nl.placeholder) && text !== stripTags(i18n.en.placeholder);
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY_CONTENT, editor.innerHTML);
      const timeStr = new Date().toTimeString().slice(0, 5);
      const t = i18n[currentLang];
      document.getElementById('statusBar').textContent = t.statusSaved + timeStr + t.statusSavedEnd;
    } catch (e) {}
  }

  function applyLanguageUI(lang) {
    const oldPlaceholder = i18n[currentLang].placeholder;
    currentLang = lang;
    const t = i18n[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.title;
    document.getElementById('btnHeading').innerHTML = t.heading;
    document.getElementById('btnNormal').textContent = t.normal;
    document.getElementById('btnBullet').textContent = t.bullet;
    document.getElementById('btnNumber').textContent = t.number;
    document.getElementById('btnTable').textContent = t.table;
    document.getElementById('btnRow').textContent = t.row;
    document.getElementById('btnDelRow').textContent = t.delRow;
    document.getElementById('btnCol').textContent = t.col;
    document.getElementById('btnDelCol').textContent = t.delCol;
    document.getElementById('btnClear').textContent = t.clearBtn;
    document.getElementById('btnOpen').textContent = t.openBtn;
    document.getElementById('btnExport').textContent = t.exportBtn;
    document.getElementById('btnLang').textContent = t.langBtn;
    document.getElementById('statusBar').textContent = t.statusReady;

    const currentText = editor.textContent.trim();
    if (currentText === '' || currentText === stripTags(oldPlaceholder)) {
      editor.innerHTML = `<p>${t.placeholder}</p>`;
    }
  }

  function toggleLang() {
    const nextLang = currentLang === 'nl' ? 'en' : 'nl';
    applyLanguageUI(nextLang);
    try { localStorage.setItem(STORAGE_KEY_LANG, nextLang); } catch (e) {}
  }

  (function restoreState() {
    try {
      const savedLang = localStorage.getItem(STORAGE_KEY_LANG);
      if (savedLang === 'en' || savedLang === 'nl') {
        applyLanguageUI(savedLang);
      }
      const savedContent = localStorage.getItem(STORAGE_KEY_CONTENT);
      if (savedContent && savedContent.trim() !== '') {
        editor.innerHTML = savedContent;
      }
    } catch (e) {}
  })();

  editor.addEventListener('input', saveState);

  // Voorkom dat klikken op werkbalkknoppen de cursorfocus uit de tekst of tabelcel steelt
  document.querySelectorAll('.toolbar button').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
  });

  window.addEventListener('beforeunload', (e) => {
    if (hasMeaningfulContent()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function clearEditor() {
    const t = i18n[currentLang];
    if (hasMeaningfulContent() && !confirm(t.confirmClear)) return;
    editor.innerHTML = `<p>${t.placeholder}</p>`;
    try { localStorage.removeItem(STORAGE_KEY_CONTENT); } catch (e) {}
    document.getElementById('statusBar').textContent = t.statusReady;
    editor.focus();
  }

  function triggerOpenFile() {
    const t = i18n[currentLang];
    if (hasMeaningfulContent() && !confirm(t.confirmOverwrite)) return;
    document.getElementById('fileInput').click();
  }

  function escXml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function getErrorMsg() {
    return i18n[currentLang].alertError;
  }

  function cmd(command, value = null) {
    document.execCommand(command, false, value);
    editor.focus();
    saveState();
  }

  function insertTable() {
    const t = i18n[currentLang];
    const rows = parseInt(prompt(t.promptRows, "3"), 10);
    const cols = parseInt(prompt(t.promptCols, "3"), 10);
    if (!rows || !cols || rows < 1 || cols < 1) return;
    let html = '<table><tbody>';
    for (let r = 0; r < rows; r++) {
      html += '<tr>';
      for (let c = 0; c < cols; c++) html += '<td><br></td>';
      html += '</tr>';
    }
    html += '</tbody></table><p><br></p>';
    document.execCommand('insertHTML', false, html);
    saveState();
  }

  function getActiveTableCell() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    let node = sel.anchorNode;

    // Als Chromium op een <tr> of <table> staat (bijv. in een lege eerste cel), pak het exacte kind-element
    if (node && node.nodeType === 1 && (node.nodeName === 'TR' || node.nodeName === 'TBODY' || node.nodeName === 'TABLE')) {
      const child = node.childNodes[sel.anchorOffset] || node.childNodes[Math.max(0, sel.anchorOffset - 1)];
      if (child) node = child;
    }

    while (node && node !== editor) {
      if (node.nodeName === 'TD' || node.nodeName === 'TH') return node;
      node = node.parentNode;
    }
    return null;
  }

  function focusCell(cell) {
    if (!cell) return;
    editor.focus();
    const range = document.createRange();
    range.selectNodeContents(cell);
    range.collapse(true);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function addRow() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const row = cell.parentNode;
    const newRow = row.cloneNode(true);
    Array.from(newRow.cells).forEach(c => c.innerHTML = '<br>');
    row.parentNode.insertBefore(newRow, row.nextSibling);
    if (newRow.cells[cell.cellIndex]) focusCell(newRow.cells[cell.cellIndex]);
    saveState();
  }

  function deleteRow() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const row = cell.parentNode;
    const table = cell.closest('table');
    const colIdx = cell.cellIndex;

    if (table.rows.length <= 1) {
      table.remove();
      editor.focus();
    } else {
      const nextRow = row.nextElementSibling || row.previousElementSibling;
      row.remove();
      if (nextRow && nextRow.cells[colIdx]) focusCell(nextRow.cells[colIdx]);
    }
    saveState();
  }

  function addCol() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const colIndex = cell.cellIndex;
    const row = cell.parentNode;
    const table = cell.closest('table');
    Array.from(table.rows).forEach(r => {
      const newCell = r.insertCell(colIndex + 1);
      newCell.innerHTML = '<br>';
    });
    if (row.cells[colIndex + 1]) focusCell(row.cells[colIndex + 1]);
    saveState();
  }

  function deleteCol() {
    const cell = getActiveTableCell();
    if (!cell) return alert(i18n[currentLang].alertTable);
    const colIndex = cell.cellIndex;
    const row = cell.parentNode;
    const table = cell.closest('table');

    if (table.rows[0].cells.length <= 1) {
      table.remove();
      editor.focus();
    } else {
      Array.from(table.rows).forEach(r => {
        if (r.cells[colIndex]) r.deleteCell(colIndex);
      });
      const nextCell = row.cells[colIndex] || row.cells[colIndex - 1];
      if (nextCell) focusCell(nextCell);
    }
    saveState();
  }

  // --- Bestaand .DOCX bestand uitpakken en inlezen (inclusief afbeeldingen) ---
  async function extractAllZipEntries(arrayBuffer) {
    const dv = new DataView(arrayBuffer);
    const bytes = new Uint8Array(arrayBuffer);
    const dec = new TextDecoder();

    let eocdOffset = -1;
    for (let i = bytes.length - 22; i >= 0; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
    }
    if (eocdOffset === -1) throw new Error('Geen geldig ZIP/DOCX-bestand');

    const totalEntries = dv.getUint16(eocdOffset + 10, true);
    let cdOffset = dv.getUint32(eocdOffset + 16, true);
    const entries = {};

    for (let i = 0; i < totalEntries; i++) {
      if (dv.getUint32(cdOffset, true) !== 0x02014b50) break;
      const compression = dv.getUint16(cdOffset + 10, true);
      const compSize = dv.getUint32(cdOffset + 20, true);
      const nameLen = dv.getUint16(cdOffset + 28, true);
      const extraLen = dv.getUint16(cdOffset + 30, true);
      const commentLen = dv.getUint16(cdOffset + 32, true);
      const localHeaderOffset = dv.getUint32(cdOffset + 42, true);
      const fileName = dec.decode(bytes.subarray(cdOffset + 46, cdOffset + 46 + nameLen));

      const lNameLen = dv.getUint16(localHeaderOffset + 26, true);
      const lExtraLen = dv.getUint16(localHeaderOffset + 28, true);
      const dataStart = localHeaderOffset + 30 + lNameLen + lExtraLen;
      const compData = bytes.subarray(dataStart, dataStart + compSize);

      if (compression === 0) {
        entries[fileName] = compData;
      } else if (compression === 8) {
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(compData);
        writer.close();
        const outBuf = await new Response(ds.readable).arrayBuffer();
        entries[fileName] = new Uint8Array(outBuf);
      }
      cdOffset += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  function bytesToBase64(bytes) {
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  function parseDocxRuns(pNode, mediaMap) {
    let html = '';
    Array.from(pNode.childNodes).forEach(child => {
      if (child.localName === 'r') {
        const rPr = Array.from(child.childNodes).find(n => n.localName === 'rPr');
        let isB = false, isI = false, isU = false;
        if (rPr) {
          Array.from(rPr.childNodes).forEach(prop => {
            if (prop.localName === 'b' && prop.getAttribute('w:val') !== '0' && prop.getAttribute('w:val') !== 'false') isB = true;
            if (prop.localName === 'i' && prop.getAttribute('w:val') !== '0' && prop.getAttribute('w:val') !== 'false') isI = true;
            if (prop.localName === 'u' && prop.getAttribute('w:val') !== 'none') isU = true;
          });
        }
        let runHtml = '';
        Array.from(child.childNodes).forEach(sub => {
          if (sub.localName === 't') {
            runHtml += escXml(sub.textContent);
          } else if (sub.localName === 'br') {
            runHtml += '<br>';
          } else if (sub.localName === 'tab') {
            runHtml += '&emsp;';
          } else if (sub.localName === 'drawing') {
            const blip = sub.getElementsByTagNameNS('*', 'blip')[0];
            if (blip) {
              const rId = blip.getAttribute('r:embed') || blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'embed');
              if (rId && mediaMap[rId]) {
                runHtml += `<img src="${mediaMap[rId]}">`;
              }
            }
          }
        });
        if (runHtml) {
          if (!runHtml.startsWith('<img')) {
            if (isU) runHtml = `<u>${runHtml}</u>`;
            if (isI) runHtml = `<i>${runHtml}</i>`;
            if (isB) runHtml = `<b>${runHtml}</b>`;
          }
          html += runHtml;
        }
      } else if (child.localName === 'hyperlink') {
        html += parseDocxRuns(child, mediaMap);
      }
    });
    return html;
  }

  function docxEntriesToHtml(entries) {
    const dec = new TextDecoder();
    if (!entries['word/document.xml']) throw new Error('word/document.xml ontbreekt');
    const docXmlStr = dec.decode(entries['word/document.xml']);

    const mediaMap = {};
    if (entries['word/_rels/document.xml.rels']) {
      const relsStr = dec.decode(entries['word/_rels/document.xml.rels']);
      const relsDoc = new DOMParser().parseFromString(relsStr, 'application/xml');
      Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(rel => {
        const id = rel.getAttribute('Id');
        const target = rel.getAttribute('Target') || '';
        const cleanPath = target.startsWith('/') ? target.slice(1) : `word/${target.replace(/^\/+/, '')}`;
        if (entries[cleanPath]) {
          const ext = cleanPath.split('.').pop().toLowerCase();
          const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : (ext === 'gif' ? 'image/gif' : 'image/png');
          mediaMap[id] = `data:${mime};base64,${bytesToBase64(entries[cleanPath])}`;
        }
      });
    }

    const xmlDoc = new DOMParser().parseFromString(docXmlStr, 'application/xml');
    const body = xmlDoc.getElementsByTagNameNS('*', 'body')[0];
    if (!body) return '<p><br></p>';

    let resultHtml = '';
    Array.from(body.childNodes).forEach(node => {
      if (node.localName === 'p') {
        const pPr = Array.from(node.childNodes).find(n => n.localName === 'pPr');
        let isHeading = false;
        if (pPr) {
          const pStyle = Array.from(pPr.childNodes).find(n => n.localName === 'pStyle');
          const val = pStyle ? (pStyle.getAttribute('w:val') || pStyle.getAttribute('val') || '') : '';
          if (/^(Heading|Kop|Title|Titel)/i.test(val)) isHeading = true;
        }
        const inner = parseDocxRuns(node, mediaMap) || '<br>';
        resultHtml += isHeading ? `<h2>${inner}</h2>` : `<p>${inner}</p>`;
      } else if (node.localName === 'tbl') {
        resultHtml += '<table><tbody>';
        Array.from(node.childNodes).forEach(tr => {
          if (tr.localName === 'tr') {
            resultHtml += '<tr>';
            Array.from(tr.childNodes).forEach(tc => {
              if (tc.localName === 'tc') {
                const cellPs = Array.from(tc.childNodes).filter(n => n.localName === 'p');
                const cellHtml = cellPs.map(p => parseDocxRuns(p, mediaMap)).filter(Boolean).join('<br>') || '<br>';
                resultHtml += `<td>${cellHtml}</td>`;
              }
            });
            resultHtml += '</tr>';
          }
        });
        resultHtml += '</tbody></table>';
      }
    });
    return resultHtml || '<p><br></p>';
  }

  window.importDocxBuffer = async function(arrayBuffer) {
    const entries = await extractAllZipEntries(arrayBuffer);
    editor.innerHTML = docxEntriesToHtml(entries);
    saveState();
  };

  // --- HTML naar echte .DOCX (OpenXML + ZIP) generator ---
  function dataUrlToBytes(dataUrl) {
    const match = dataUrl.match(/^data:image\/(png|jpe?g|gif|webp);base64,(.+)$/i);
    if (!match) return null;
    const ext = match[1].toLowerCase() === 'jpeg' ? 'jpg' : match[1].toLowerCase();
    const bin = atob(match[2]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { ext, bytes };
  }

  function buildDrawingXml(rId, idNum, widthPx, heightPx) {
    const maxPx = 560;
    let w = widthPx || 300;
    let h = heightPx || 200;
    if (w > maxPx) {
      h = Math.round(h * (maxPx / w));
      w = maxPx;
    }
    const cx = w * 9525;
    const cy = h * 9525;
    return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"
      xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
      <wp:extent cx="${cx}" cy="${cy}"/>
      <wp:docPr id="${idNum}" name="Afbeelding ${idNum}"/>
      <a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
        <a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
          <pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
            <pic:nvPicPr><pic:cNvPr id="${idNum}" name="img${idNum}"/><pic:cNvPicPr/></pic:nvPicPr>
            <pic:blipFill>
              <a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>
              <a:stretch><a:fillRect/></a:stretch>
            </pic:blipFill>
            <pic:spPr>
              <a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>
              <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
            </pic:spPr>
          </pic:pic>
        </a:graphicData>
      </a:graphic>
    </wp:inline></w:drawing></w:r>`;
  }

  function serializeRuns(node, style = {}, mediaList = []) {
    let xml = '';
    node.childNodes.forEach(child => {
      if (child.nodeType === 3) {
        const text = child.nodeValue;
        if (text) {
          let rPr = '';
          if (style.b) rPr += '<w:b/>';
          if (style.i) rPr += '<w:i/>';
          if (style.u) rPr += '<w:u w:val="single"/>';
          if (style.h) rPr += '<w:b/><w:sz w:val="32"/>';
          xml += `<w:r>${rPr ? `<w:rPr>${rPr}</w:rPr>` : ''}<w:t xml:space="preserve">${escXml(text)}</w:t></w:r>`;
        }
      } else if (child.nodeType === 1) {
        const tag = child.tagName;
        if (tag === 'BR') {
          xml += '<w:r><w:br/></w:r>';
        } else if (tag === 'IMG') {
          const parsed = dataUrlToBytes(child.src);
          if (parsed) {
            const idx = mediaList.length + 1;
            const rId = `rIdImg${idx}`;
            const fileName = `media/image${idx}.${parsed.ext}`;
            mediaList.push({ rId, fileName, ext: parsed.ext, bytes: parsed.bytes });
            const w = child.clientWidth || child.naturalWidth || 300;
            const h = child.clientHeight || child.naturalHeight || 200;
            xml += buildDrawingXml(rId, idx, w, h);
          }
        } else {
          const nextStyle = { ...style };
          if (tag === 'B' || tag === 'STRONG') nextStyle.b = true;
          if (tag === 'I' || tag === 'EM') nextStyle.i = true;
          if (tag === 'U') nextStyle.u = true;
          xml += serializeRuns(child, nextStyle, mediaList);
        }
      }
    });
    return xml;
  }

  function htmlToDocumentXml(root, mediaList) {
    let bodyXml = '';
    function walk(container) {
      container.childNodes.forEach(node => {
        if (node.nodeType === 3) {
          if (node.nodeValue.trim()) {
            bodyXml += `<w:p>${serializeRuns(node.parentNode, {}, mediaList)}</w:p>`;
          }
          return;
        }
        if (node.nodeType !== 1) return;
        const tag = node.tagName;
        if (tag === 'IMG') {
          const parsed = dataUrlToBytes(node.src);
          if (parsed) {
            const idx = mediaList.length + 1;
            const rId = `rIdImg${idx}`;
            const fileName = `media/image${idx}.${parsed.ext}`;
            mediaList.push({ rId, fileName, ext: parsed.ext, bytes: parsed.bytes });
            const w = node.clientWidth || node.naturalWidth || 300;
            const h = node.clientHeight || node.naturalHeight || 200;
            bodyXml += `<w:p>${buildDrawingXml(rId, idx, w, h)}</w:p>`;
          }
        } else if (tag === 'H1' || tag === 'H2' || tag === 'H3') {
          bodyXml += `<w:p><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr>${serializeRuns(node, { h: true }, mediaList)}</w:p>`;
        } else if (tag === 'UL' || tag === 'OL') {
          let idx = 1;
          node.querySelectorAll(':scope > li').forEach(li => {
            const prefix = tag === 'OL' ? `${idx++}. ` : '• ';
            bodyXml += `<w:p><w:pPr><w:ind w:left="720"/></w:pPr><w:r><w:t xml:space="preserve">${prefix}</w:t></w:r>${serializeRuns(li, {}, mediaList)}</w:p>`;
          });
        } else if (tag === 'TABLE') {
          bodyXml += `<w:tbl><w:tblPr><w:tblW w:w="9072" w:type="dxa"/><w:tblBorders>
            <w:top w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:left w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:bottom w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:right w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:insideH w:val="single" w:sz="6" w:space="0" w:color="333333"/>
            <w:insideV w:val="single" w:sz="6" w:space="0" w:color="333333"/>
          </w:tblBorders></w:tblPr>`;
          node.querySelectorAll('tr').forEach(tr => {
            bodyXml += '<w:tr>';
            tr.querySelectorAll('td, th').forEach(td => {
              const runs = serializeRuns(td, {}, mediaList);
              bodyXml += `<w:tc><w:p>${runs || ''}</w:p></w:tc>`;
            });
            bodyXml += '</w:tr>';
          });
          bodyXml += '</w:tbl><w:p/>';
        } else if (tag === 'P' || tag === 'DIV') {
          bodyXml += `<w:p>${serializeRuns(node, {}, mediaList)}</w:p>`;
        } else {
          walk(node);
        }
      });
    }
    walk(root);
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
        <w:body>${bodyXml || '<w:p/>'}
          <w:sectPr>
            <w:pgSz w:w="11906" w:h="16838"/>
            <w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/>
          </w:sectPr>
        </w:body>
      </w:document>`;
  }

  function crc32(buf) {
    let c = ~0;
    for (let i = 0; i < buf.length; i++) {
      c ^= buf[i];
      for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
    }
    return (~c) >>> 0;
  }

  function makeZip(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const [name, content] of files) {
      const nameBytes = enc.encode(name);
      const data = content instanceof Uint8Array ? content : enc.encode(content);
      const crc = crc32(data);
      const header = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(header.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(8, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      header.set(nameBytes, 30);
      parts.push(header, data);

      const cdir = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(cdir.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, data.length, true);
      cdv.setUint32(24, data.length, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint32(42, offset, true);
      cdir.set(nameBytes, 46);
      central.push(cdir);
      offset += header.length + data.length;
    }
    const cSize = central.reduce((s, a) => s + a.length, 0);
    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, cSize, true);
    edv.setUint32(16, offset, true);
    return new Blob([...parts, ...central, eocd], {
      type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  function exportDocx() {
    saveState();
    const mediaList = [];
    const docXml = htmlToDocumentXml(editor, mediaList);

    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
        <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
        <Default Extension="xml" ContentType="application/xml"/>
        <Default Extension="png" ContentType="image/png"/>
        <Default Extension="jpg" ContentType="image/jpeg"/>
        <Default Extension="gif" ContentType="image/gif"/>
        <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
      </Types>`;

    const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
        <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
      </Relationships>`;

    const docRelsItems = mediaList.map(m =>
      `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${m.fileName}"/>`
    ).join('');

    const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
        ${docRelsItems}
      </Relationships>`;

    const zipEntries = [
      ['[Content_Types].xml', contentTypes],
      ['_rels/.rels', rootRels],
      ['word/_rels/document.xml.rels', docRels],
      ['word/document.xml', docXml]
    ];

    for (const m of mediaList) {
      zipEntries.push([`word/${m.fileName}`, m.bytes]);
    }

    const blob = makeZip(zipEntries);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = i18n[currentLang].fileName;
    a.click();
    URL.revokeObjectURL(url);

    const timeStr = new Date().toTimeString().slice(0, 5);
    document.getElementById('statusBar').textContent = `${i18n[currentLang].statusDownloaded}${timeStr}`;
  }
</script>

<script type="module">
  import * as pdfjsLib from './pdf.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';

  function pdfImageToDataUrl(imgObj) {
    if (!imgObj || !imgObj.width || !imgObj.height) return null;
    const canvas = document.createElement('canvas');
    canvas.width = imgObj.width;
    canvas.height = imgObj.height;
    const ctx = canvas.getContext('2d');

    if (imgObj.bitmap) {
      ctx.drawImage(imgObj.bitmap, 0, 0);
      return canvas.toDataURL('image/png');
    }

    if (imgObj.data) {
      const imgData = ctx.createImageData(imgObj.width, imgObj.height);
      const src = imgObj.data;
      const dst = imgData.data;
      const pixels = imgObj.width * imgObj.height;

      if (src.length === pixels * 4) {
        dst.set(src);
      } else if (src.length === pixels * 3) {
        for (let i = 0, j = 0; i < src.length; i += 3, j += 4) {
          dst[j] = src[i];
          dst[j + 1] = src[i + 1];
          dst[j + 2] = src[i + 2];
          dst[j + 3] = 255;
        }
      } else if (src.length === pixels) {
        for (let i = 0, j = 0; i < src.length; i++, j += 4) {
          dst[j] = dst[j + 1] = dst[j + 2] = src[i];
          dst[j + 3] = 255;
        }
      } else {
        return null;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas.toDataURL('image/png');
    }
    return null;
  }

  function multiplyMatrix(m1, m2) {
    return [
      m1[0] * m2[0] + m1[1] * m2[2],
      m1[0] * m2[1] + m1[1] * m2[3],
      m1[2] * m2[0] + m1[3] * m2[2],
      m1[2] * m2[1] + m1[3] * m2[3],
      m1[4] * m2[0] + m1[5] * m2[2] + m2[4],
      m1[4] * m2[1] + m1[5] * m2[3] + m2[5]
    ];
  }

  async function extractPageImages(page) {
    const opList = await page.getOperatorList();
    const OPS = pdfjsLib.OPS;
    let ctm = [1, 0, 0, 1, 0, 0];
    const ctmStack = [];
    const foundImages = [];

    for (let i = 0; i < opList.fnArray.length; i++) {
      const fn = opList.fnArray[i];
      const args = opList.argsArray[i];

      if (fn === OPS.save) {
        ctmStack.push([...ctm]);
      } else if (fn === OPS.restore) {
        if (ctmStack.length) ctm = ctmStack.pop();
      } else if (fn === OPS.transform) {
        ctm = multiplyMatrix(args, ctm);
      } else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject) {
        try {
          let imgObj = null;
          if (fn === OPS.paintInlineImageXObject) {
            imgObj = args[0];
          } else {
            const objId = args[0];
            imgObj = await new Promise(resolve => {
              if (page.objs.has(objId)) {
                resolve(page.objs.get(objId));
              } else {
                page.objs.get(objId, obj => resolve(obj));
              }
            });
          }

          const dataUrl = pdfImageToDataUrl(imgObj);
          if (dataUrl && imgObj.width > 15 && imgObj.height > 15) {
            const topY = Math.round(ctm[5] + Math.abs(ctm[3]));
            const displayW = Math.min(Math.round(Math.abs(ctm[0])) || imgObj.width, 600);
            foundImages.push({ y: topY, dataUrl, width: displayW });
          }
        } catch (e) {
          console.warn('Afbeelding overgeslagen:', e);
        }
      }
    }
    return foundImages;
  }

  document.getElementById('fileInput').addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const arrayBuffer = await file.arrayBuffer();
      const lowerName = file.name.toLowerCase();

      if (lowerName.endsWith('.docx')) {
        await window.importDocxBuffer(arrayBuffer);
        return;
      }

      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let htmlParts = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const textContent = await page.getTextContent();
        const pageImages = await extractPageImages(page);

        const blocks = [];
        for (const item of textContent.items) {
          if (!item.str || !item.str.trim()) continue;
          const y = Math.round(item.transform[5]);
          const x = item.transform[4];
          const fontSize = Math.round(Math.abs(item.transform[0]));

          let line = blocks.find(b => b.type === 'line' && Math.abs(b.y - y) <= 4);
          if (!line) {
            line = { type: 'line', y, items: [], maxFont: fontSize };
            blocks.push(line);
          }
          line.items.push({ x, str: item.str, width: item.width });
          if (fontSize > line.maxFont) line.maxFont = fontSize;
        }

        for (const img of pageImages) {
          blocks.push({ type: 'image', y: img.y, dataUrl: img.dataUrl, width: img.width });
        }

        blocks.sort((a, b) => b.y - a.y);

        const lineBlocks = blocks.filter(b => b.type === 'line');
        const sizes = lineBlocks.map(l => l.maxFont).sort((a, b) => a - b);
        const medianFont = sizes[Math.floor(sizes.length / 2)] || 12;

        let tableBuffer = [];
        const flushTable = () => {
          if (tableBuffer.length === 0) return;
          if (tableBuffer.length >= 2) {
            let tbl = '<table><tbody>';
            for (const rowCells of tableBuffer) {
              tbl += '<tr>' + rowCells.map(c => `<td>${escXml(c)}</td>`).join('') + '</tr>';
            }
            tbl += '</tbody></table>';
            htmlParts.push(tbl);
          } else {
            htmlParts.push(`<p>${escXml(tableBuffer[0].join('   '))}</p>`);
          }
          tableBuffer = [];
        };

        for (const block of blocks) {
          if (block.type === 'image') {
            flushTable();
            htmlParts.push(`<p><img src="${block.dataUrl}" style="width:${block.width}px"></p>`);
            continue;
          }

          block.items.sort((a, b) => a.x - b.x);
          const cells = [];
          let currentCell = '';
          let prevEnd = null;

          for (const it of block.items) {
            if (prevEnd !== null && (it.x - prevEnd) > 25) {
              cells.push(currentCell.trim());
              currentCell = it.str;
            } else {
              currentCell += (prevEnd !== null && (it.x - prevEnd) > 2 ? ' ' : '') + it.str;
            }
            prevEnd = it.x + (it.width || 0);
          }
          if (currentCell.trim()) cells.push(currentCell.trim());

          if (cells.length >= 2 && block.maxFont <= medianFont + 1) {
            tableBuffer.push(cells);
          } else {
            flushTable();
            const fullText = escXml(cells.join(' '));
            if (block.maxFont >= medianFont + 3) {
              htmlParts.push(`<h2>${fullText}</h2>`);
            } else {
              htmlParts.push(`<p>${fullText}</p>`);
            }
          }
        }
        flushTable();
      }

      editor.innerHTML = htmlParts.join('') || '<p><br></p>';
      saveState();
    } catch (err) {
      console.error(err);
      alert(getErrorMsg() + '\n\n' + err.message);
    } finally {
      event.target.value = '';
    }
  });
</script>
